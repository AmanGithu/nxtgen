<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I-Assist Session</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #111118;
      --surface: #1a1a24;
      --surface-2: #22222e;
      --border: #2a2a3a;
      --text: #e4e4e7;
      --text-muted: #71717a;
      --accent: #f5820b;
      --accent-hover: #e0750a;
      --success: #1d9e75;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 8px;
    }

    body.theme-light {
      --bg: #ffffff;
      --surface: #f8fafc;
      --surface-2: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      user-select: none;
      overflow: hidden;
      height: 100vh;
    }

    .session-container {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* --- Header --- */

    .session-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      -webkit-app-region: drag;
      flex-shrink: 0;
    }

    .session-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .session-info .assistant-name {
      font-weight: 600;
      font-size: 13px;
    }

    .category-badge {
      font-size: 10px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .badge-behavioral { background: #26215C; color: #9B93F0; }
    .badge-technical { background: #04342C; color: #34D399; }
    .badge-system_design { background: #4A1B0C; color: #FB923C; }
    .badge-general { background: #27272a; color: #a1a1aa; }

    .session-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    .timer {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: var(--accent);
      min-width: 44px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s;
      -webkit-app-region: no-drag;
    }

    .icon-btn:hover { color: var(--text); background: var(--surface); }

    .stop-btn {
      background: var(--danger);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
    }

    .stop-btn:hover { background: #dc2626; }

    /* --- Split content: questions left, answer right --- */

    .session-content {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1.8fr;
      overflow: hidden;
      min-height: 0;
    }


    .pane {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .transcript-pane {
      border-right: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.12);
    }

    body.theme-light .transcript-pane { background: rgba(0, 0, 0, 0.03); }

    .pane-head {
      padding: 8px 14px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .pane-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      background: var(--surface-2);
      border-radius: 8px;
      padding: 1px 6px;
    }

    .scroll-area {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .scroll-area::-webkit-scrollbar { width: 4px; }
    .scroll-area::-webkit-scrollbar-track { background: transparent; }
    .scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* --- Left: question list --- */

    .transcript-list {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .transcript-item {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
      border-left: 3px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }

    .transcript-item:hover { background: var(--surface); }

    .transcript-item.selected {
      background: rgba(245, 130, 11, 0.1);
      border-left-color: var(--accent);
    }

    .transcript-time {
      font-size: 10px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pending-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.2s infinite;
    }

    .transcript-text {
      font-size: 12px;
      line-height: 1.45;
      color: var(--text);
      word-wrap: break-word;
    }

    .transcript-item.selected .transcript-text { font-weight: 600; }

    /* --- Right: answer --- */

    .answer-body {
      padding: 16px 18px;
      font-size: var(--answer-font-size, 13px);
      line-height: 1.7;
      color: var(--text);
      word-wrap: break-word;
      user-select: text;
    }

    /* pre-wrap lives on the prose spans, not on .answer-body: on the container it
       would also render the newlines and indentation of the code block's own markup
       as blank lines around every snippet. */
    .answer-prose {
      display: block;
      white-space: pre-wrap;
    }

    .answer-prose + .answer-prose { margin-top: 8px; }

    /* --- Code blocks, inline in the answer --- */

    .code-block {
      margin: 12px 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.22);
    }

    body.theme-light .code-block { background: rgba(0, 0, 0, 0.04); }

    .code-block:first-child { margin-top: 0; }
    .code-block:last-child { margin-bottom: 0; }

    .code-block-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 12px;
      background: var(--surface);
    }

    .code-lang {
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
    }

    .copy-btn {
      background: var(--surface-2);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 10px;
      font-family: inherit;
      cursor: pointer;
      flex-shrink: 0;
    }

    .copy-btn:hover { color: var(--text); border-color: var(--text-muted); }
    .copy-btn.copied { color: var(--success); border-color: var(--success); }

    .code-body {
      margin: 0;
      padding: 12px;
      font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace;
      /* Tracks the answer font size (Ctrl+Shift+Alt+= / -) one step down, so the
         snippet stays proportionate to the prose it sits inside. */
      font-size: calc(var(--answer-font-size, 13px) - 1px);
      line-height: 1.55;
      color: var(--text);
      white-space: pre;
      overflow-x: auto;
      user-select: text;
      tab-size: 2;
    }

    .code-body::-webkit-scrollbar { height: 4px; }
    .code-body::-webkit-scrollbar-track { background: transparent; }
    .code-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .tok-key { color: #c084fc; }
    .tok-str { color: #86efac; }
    .tok-com { color: var(--text-muted); font-style: italic; }
    .tok-num { color: #fbbf24; }
    .tok-fn  { color: #60a5fa; }

    body.theme-light .tok-key { color: #7c3aed; }
    body.theme-light .tok-str { color: #15803d; }
    body.theme-light .tok-num { color: #b45309; }
    body.theme-light .tok-fn  { color: #1d4ed8; }

    .answer-question {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
      flex-shrink: 0;
      word-wrap: break-word;
    }

    .placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
      padding: 20px;
      line-height: 1.5;
    }

    .thinking-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 16px 18px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .thinking-dots span {
      display: inline-block;
      width: 4px;
      height: 4px;
      background: var(--accent);
      border-radius: 50%;
      animation: dotPulse 1.2s infinite;
      margin-right: 2px;
    }

    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* --- Live transcription bar --- */

    .live-bar {
      border-top: 1px solid var(--border);
      padding: 8px 14px;
      background: var(--surface);
      flex-shrink: 0;
    }

    .live-bar .label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-bar .label .rec-dot {
      width: 6px;
      height: 6px;
      background: var(--danger);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .live-bar .live-text {
      font-size: 12px;
      color: var(--text);
      min-height: 18px;
      max-height: 36px;
      overflow-y: auto;
      word-wrap: break-word;
    }

    /* --- Query input --- */

    .query-bar {
      border-top: 1px solid var(--border);
      padding: 8px 14px;
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .query-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 6px 10px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      resize: none;
    }

    .query-input:focus { border-color: var(--accent); }
    .query-input::placeholder { color: var(--text-muted); }

    .send-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      align-self: flex-end;
    }

    .send-btn:hover { background: var(--accent-hover); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="session-container">
    <div class="session-header">
      <div class="session-info">
        <span class="assistant-name" id="assistant-name">Assistant</span>
        <span class="category-badge badge-general" id="category-badge">General</span>
      </div>
      <div class="session-controls">
        <span class="timer" id="timer">00:00</span>
        <button class="icon-btn" id="btn-hide" title="Hide window (Ctrl+Shift+Alt+T)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
        <button class="stop-btn" id="btn-stop" title="Stop session (Ctrl+Shift+Alt+K)">Stop</button>
      </div>
    </div>

    <div class="session-content">
      <!-- LEFT: questions heard -->
      <div class="pane transcript-pane">
        <div class="pane-head">
          <span>Questions</span>
          <span class="pane-count" id="question-count">0</span>
        </div>
        <div class="scroll-area" id="transcript-scroll">
          <div class="placeholder" id="transcript-placeholder">
            Listening for audio…<br>Questions will appear here.
          </div>
          <div class="transcript-list hidden" id="transcript-list"></div>
        </div>
      </div>

      <!-- RIGHT: answer for the selected question -->
      <div class="pane response-pane">
        <div class="pane-head"><span>Suggested Answer</span></div>
        <div class="answer-question hidden" id="answer-question"></div>
        <div class="scroll-area" id="answer-scroll">
          <div class="placeholder" id="answer-placeholder">
            The suggested answer will appear here.
          </div>
          <div class="thinking-indicator hidden" id="thinking-indicator">
            <div class="thinking-dots"><span></span><span></span><span></span></div>
            <span>Thinking…</span>
          </div>
          <div class="answer-body hidden" id="answer-body"></div>
        </div>
      </div>

    </div>

    <div class="live-bar">
      <div class="label">
        <span class="rec-dot"></span>
        Live Transcription
      </div>
      <div class="live-text" id="live-text">Waiting for speech...</div>
    </div>

    <div class="query-bar">
      <input type="text" class="query-input" id="query-input" placeholder="Ask a question or type a command..." />
      <button class="send-btn" id="btn-send">Send</button>
    </div>
  </div>

  <script>
    const $ = (sel) => document.querySelector(sel);
    const transcriptList = $('#transcript-list');
    const transcriptPlaceholder = $('#transcript-placeholder');
    const transcriptScroll = $('#transcript-scroll');
    const questionCount = $('#question-count');
    const answerBody = $('#answer-body');
    const answerQuestion = $('#answer-question');
    const answerPlaceholder = $('#answer-placeholder');
    const answerScroll = $('#answer-scroll');
    const thinkingIndicator = $('#thinking-indicator');
    const liveText = $('#live-text');
    const timerEl = $('#timer');
    const btnStop = $('#btn-stop');
    const btnHide = $('#btn-hide');
    const btnSend = $('#btn-send');
    const queryInput = $('#query-input');
    const assistantNameEl = $('#assistant-name');
    const categoryBadge = $('#category-badge');

    let sessionSeconds = 0;
    let timerInterval = null;
    let conversationHistory = [];

    // One entry per question asked; the right pane renders whichever is selected.
    let entries = [];
    let selectedId = null;
    let nextId = 1;

    // Transcription accumulation — debounce fragments into full utterances
    let pendingTranscription = '';
    let transcriptionDebounceTimer = null;
    const TRANSCRIPTION_DEBOUNCE_MS = 2000;

    // --- Audio capture ---

    let mediaStream = null;
    let mediaRecorder = null;
    let vadInterval = null;
    let audioContext = null;
    let analyser = null;
    // Overridden by admin config at session start; these are the fallbacks.
    let VAD_THRESHOLD = 0.015;
    let SILENCE_DURATION_MS = 1500;
    let MIN_CHUNK_DURATION_MS = 500;
    const VAD_INTERVAL_MS = 100;
    const MAX_CHUNK_DURATION_MS = 15000;

    function applyVadConfig(vad) {
      if (!vad) return;
      if (Number.isFinite(vad.amplitudeThreshold)) VAD_THRESHOLD = vad.amplitudeThreshold;
      if (Number.isFinite(vad.silenceMs)) SILENCE_DURATION_MS = vad.silenceMs;
      if (Number.isFinite(vad.minSpeechMs)) MIN_CHUNK_DURATION_MS = vad.minSpeechMs;
    }
    let isRecording = false;
    let speechStartTime = 0;
    let silenceStart = null;

    // A standby recorder runs continuously and is recycled on this interval, so
    // whenever speech triggers we already hold up to PRE_ROLL_MS of audio from
    // *before* the amplitude threshold was crossed. Without it the opening
    // word of every utterance is lost, because recording could only start once
    // the sound that would have triggered it had already played.
    const PRE_ROLL_MS = 1000;
    const STANDBY_STAGGER_MS = PRE_ROLL_MS / 2;
    let preRollTimer = null;
    let standbys = [];

    async function startAudioCapture() {
      try {
        const displayStream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true,
        });

        displayStream.getVideoTracks().forEach(t => t.stop());

        if (displayStream.getAudioTracks().length === 0) {
          throw new Error('No audio track from display media');
        }

        mediaStream = new MediaStream(displayStream.getAudioTracks());
      } catch (err) {
        console.error('System audio capture failed, falling back to microphone', err);
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (micErr) {
          console.error('Microphone capture also failed', micErr);
          liveText.textContent = 'Audio capture failed. Check permissions.';
          return;
        }
      }

      audioContext = new AudioContext();
      const source = audioContext.createMediaStreamSource(mediaStream);
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;
      source.connect(analyser);

      startStandbyRecorder();
      startPreRollCycle();
      startVAD();
    }

    function startVAD() {
      const dataArray = new Float32Array(analyser.fftSize);

      vadInterval = setInterval(() => {
        analyser.getFloatTimeDomainData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
          sum += dataArray[i] * dataArray[i];
        }
        const rms = Math.sqrt(sum / dataArray.length);

        if (isRecording) {
          const elapsed = Date.now() - speechStartTime;

          if (rms > VAD_THRESHOLD) {
            silenceStart = null;
          } else {
            if (!silenceStart) {
              silenceStart = Date.now();
            } else if (Date.now() - silenceStart >= SILENCE_DURATION_MS) {
              stopRecordingChunk();
            }
          }

          if (elapsed >= MAX_CHUNK_DURATION_MS) {
            stopRecordingChunk();
          }
        } else {
          if (rms > VAD_THRESHOLD) {
            startRecordingChunk();
          }
        }
      }, VAD_INTERVAL_MS);
    }

    // Each recorder owns its own chunk array, so a recycled standby recorder
    // flushing late can never leak audio into the next one.
    function newRecorder(onKeep) {
      const rec = new MediaRecorder(mediaStream, {
        mimeType: 'audio/webm;codecs=opus',
      });

      const chunks = [];
      rec.ondataavailable = (e) => {
        if (e.data.size > 0) chunks.push(e.data);
      };
      rec.onstop = () => {
        if (rec.keepOnStop) onKeep(chunks);
      };

      rec.keepOnStop = false;
      rec.start();
      return rec;
    }

    function sendUtterance(chunks) {
      isRecording = false;
      const speechMs = Date.now() - speechStartTime;
      startStandbyRecorder();

      // Measured from speech onset, not recorder start — the pre-roll is
      // padding and must not make a too-short utterance look long enough.
      if (chunks.length === 0 || speechMs < MIN_CHUNK_DURATION_MS) return;

      const blob = new Blob(chunks, { type: 'audio/webm;codecs=opus' });
      const reader = new FileReader();
      reader.onloadend = () => {
        const base64 = reader.result.split(',')[1];
        window.iAssist.sendAudioChunk(base64, 'audio/webm;codecs=opus');
      };
      reader.readAsDataURL(blob);
    }

    function discardStandby(entry) {
      if (entry.rec.state === 'recording') {
        entry.rec.keepOnStop = false;
        entry.rec.stop();
      }
    }

    function spawnStandby() {
      if (!mediaStream) return;
      standbys.push({ rec: newRecorder(sendUtterance), startedAt: Date.now() });
    }

    function startStandbyRecorder() {
      standbys.forEach(discardStandby);
      standbys = [];
      spawnStandby();
    }

    // Two standby recorders run staggered by half the pre-roll window. A single
    // recycled recorder leaves a moment where the only recorder has just
    // started and holds no history — speech beginning there still lost its
    // opening word. With a staggered pair, the older recorder always carries
    // between STANDBY_STAGGER_MS and PRE_ROLL_MS of audio, so the pre-roll
    // never approaches zero.
    function startPreRollCycle() {
      clearInterval(preRollTimer);
      preRollTimer = setInterval(() => {
        if (isRecording || !mediaStream) return;
        spawnStandby();
        while (standbys.length > 2) discardStandby(standbys.shift());
      }, STANDBY_STAGGER_MS);
    }

    // Speech detected: adopt the OLDEST standby (the one with the most history)
    // and drop the rest. It already contains the run-up to this moment.
    function startRecordingChunk() {
      if (isRecording || standbys.length === 0) return;

      const chosen = standbys[0];
      if (chosen.rec.state !== 'recording') return;

      isRecording = true;
      speechStartTime = Date.now();
      silenceStart = null;

      chosen.rec.keepOnStop = true;
      mediaRecorder = chosen.rec;

      standbys.slice(1).forEach(discardStandby);
      standbys = [];
    }

    function stopRecordingChunk() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    }

    function stopAudioCapture() {
      clearInterval(vadInterval);
      vadInterval = null;
      clearInterval(preRollTimer);
      preRollTimer = null;

      // Only an adopted recorder (keepOnStop) flushes here, so a mid-utterance
      // session end still delivers the last question. Idle standbys are dropped.
      if (isRecording && mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
      mediaRecorder = null;

      standbys.forEach(discardStandby);
      standbys = [];

      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
        mediaStream = null;
      }

      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }

      isRecording = false;
      silenceStart = null;
    }

    // --- Timer ---

    function startTimer() {
      sessionSeconds = 0;
      timerInterval = setInterval(() => {
        sessionSeconds++;
        const m = String(Math.floor(sessionSeconds / 60)).padStart(2, '0');
        const s = String(sessionSeconds % 60).padStart(2, '0');
        timerEl.textContent = `${m}:${s}`;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function formatTimestamp(seconds) {
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // --- Code extraction ---

    // Splits a streamed answer into an ordered list of prose and code segments, so the
    // answer can be rebuilt in reading order with the snippet sitting where the model
    // put it. A trailing fence with no closing ``` is treated as an open code segment
    // rather than discarded, so code renders as it streams instead of only once the
    // answer completes. `blocks` indexes the code segments for the copy buttons.
    function splitCodeBlocks(text) {
      const segments = [];
      const blocks = [];
      let i = 0;

      const pushProse = (raw) => {
        const prose = raw.replace(/\n{3,}/g, '\n\n');
        if (prose.trim()) segments.push({ type: 'prose', text: prose.trim() });
      };

      const pushCode = (lang, code) => {
        const block = { lang, code };
        blocks.push(block);
        segments.push({ type: 'code', block, index: blocks.length - 1 });
      };

      while (i < text.length) {
        const start = text.indexOf('```', i);
        if (start === -1) {
          pushProse(text.slice(i));
          break;
        }
        pushProse(text.slice(i, start));

        const nl = text.indexOf('\n', start + 3);
        const lang = (nl === -1 ? text.slice(start + 3) : text.slice(start + 3, nl)).trim();
        const bodyStart = nl === -1 ? text.length : nl + 1;
        const end = text.indexOf('```', bodyStart);

        if (end === -1) {
          pushCode(lang, text.slice(bodyStart));
          break;
        }
        pushCode(lang, text.slice(bodyStart, end).replace(/\n$/, ''));
        i = end + 3;
      }

      return { segments, blocks };
    }

    const KEYWORDS = {
      javascript: 'await async break case catch class const continue default delete do else export extends finally for from function if import in instanceof let new of return static super switch this throw try typeof var void while yield true false null undefined',
      typescript: 'any as await async boolean break case catch class const continue default delete do else enum export extends finally for from function if implements import in instanceof interface let new number of private protected public readonly return static string super switch this throw try type typeof var void while yield true false null undefined',
      python: 'and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield True False None self',
      java: 'abstract boolean break byte case catch char class const continue default do double else enum extends final finally float for if implements import instanceof int interface long native new package private protected public return short static super switch synchronized this throw throws try void volatile while true false null var',
      csharp: 'abstract as base bool break byte case catch char class const continue decimal default do double else enum event explicit extern finally float for foreach if implicit int interface internal is lock long namespace new null object out override params private protected public readonly ref return sealed short sizeof static string struct switch this throw try typeof uint ulong using var virtual void while true false',
      cpp: 'auto bool break case catch char class const constexpr continue default delete do double else enum explicit extern false float for friend goto if inline int long namespace new nullptr operator private protected public return short signed sizeof static struct switch template this throw true try typedef typename union unsigned using virtual void volatile while',
      go: 'break case chan const continue default defer else fallthrough for func go goto if import interface map package range return select struct switch type var nil true false',
      sql: 'select from where insert update delete into values set join left right inner outer on group by order having limit offset as and or not null distinct count sum avg min max create table alter drop primary key foreign references index union all case when then else end',
      rust: 'as async await break const continue crate dyn else enum extern false fn for if impl in let loop match mod move mut pub ref return self static struct super trait true type unsafe use where while',
    };

    KEYWORDS.js = KEYWORDS.javascript;
    KEYWORDS.ts = KEYWORDS.typescript;
    KEYWORDS.jsx = KEYWORDS.javascript;
    KEYWORDS.tsx = KEYWORDS.typescript;
    KEYWORDS.py = KEYWORDS.python;
    KEYWORDS['c++'] = KEYWORDS.cpp;
    KEYWORDS.c = KEYWORDS.cpp;
    KEYWORDS.cs = KEYWORDS.csharp;
    KEYWORDS.rs = KEYWORDS.rust;
    KEYWORDS.kotlin = KEYWORDS.java;
    KEYWORDS.kt = KEYWORDS.java;

    // The model does not always tag the fence, and an unlabelled block still has to
    // say what it is. Cheap shape checks beat leaving every snippet as "code".
    function guessLanguage(code) {
      if (/^\s*(def|class)\s+\w+.*:/m.test(code) || /^\s*(import|from)\s+\w+/m.test(code)) return 'python';
      if (/\b(public|private|protected)\s+(static\s+)?(class|void|int|String)\b/.test(code)) return 'java';
      if (/\bfunc\s+\w+\s*\(/.test(code) || /\bpackage\s+main\b/.test(code)) return 'go';
      if (/\bfn\s+\w+\s*\(/.test(code) || /\blet\s+mut\b/.test(code)) return 'rust';
      if (/^\s*(SELECT|INSERT|UPDATE|DELETE|CREATE)\b/im.test(code)) return 'sql';
      if (/#include\b/.test(code) || /\bstd::/.test(code)) return 'cpp';
      if (/\b(const|let|var|function|=>)\b/.test(code)) return 'javascript';
      return '';
    }

    // Comment syntax is language-specific and guessing wrong is worse than not
    // highlighting: a shared `--` rule greys out `i--;` in C, and a shared `#` rule
    // greys out `#include`. Languages not listed get the C-style set.
    function commentPatterns(lang) {
      if (lang === 'python') return ['#[^\\n]*'];
      if (lang === 'sql') return ['--[^\\n]*', '\\/\\*[\\s\\S]*?(?:\\*\\/|$)'];
      return ['\\/\\/[^\\n]*', '\\/\\*[\\s\\S]*?(?:\\*\\/|$)'];
    }

    // Single-pass tokenizer: comments and strings come first in the alternation, so a
    // keyword inside either is never re-coloured. Deliberately small — the alternative
    // is vendoring a highlighter into a page that has no bundler.
    // Fences the model uses for ASCII diagrams and plain output. Tokenising these
    // colours the numbers and quotes inside a drawing for no reason.
    const PLAIN_FENCES = new Set(['text', 'txt', 'plain', 'plaintext', 'ascii', 'diagram', 'output', 'console']);

    function highlight(code, lang) {
      const key = (lang || '').toLowerCase();
      if (PLAIN_FENCES.has(key)) return escapeHtml(code);
      const keywords = new Set((KEYWORDS[key] || '').split(' ').filter(Boolean));
      const re = new RegExp([
        `(${commentPatterns(key).join('|')})`,
        '("(?:\\\\.|[^"\\\\\\n])*"|\'(?:\\\\.|[^\'\\\\\\n])*\'|`(?:\\\\.|[^`\\\\])*`)',
        '(\\b\\d[\\w.]*\\b)',
        '([A-Za-z_]\\w*)',
      ].join('|'), 'g');

      // Escaped first, so the tokenizer sees &lt; / &amp; rather than < / &. That only
      // touches the identifier branch, and those entities are not identifiers.
      return escapeHtml(code).replace(re, (match, comment, str, num, word, offset, full) => {
        if (comment) return `<span class="tok-com">${comment}</span>`;
        if (str) return `<span class="tok-str">${str}</span>`;
        if (num) return `<span class="tok-num">${num}</span>`;
        if (word) {
          if (keywords.has(word)) return `<span class="tok-key">${word}</span>`;
          // Call sites are detected here rather than in a second pass over the
          // marked-up HTML, which would also match identifiers inside string spans.
          if (/^\s*\(/.test(full.slice(offset + word.length))) {
            return `<span class="tok-fn">${word}</span>`;
          }
          return word;
        }
        return match;
      });
    }

    let codeBlocks = [];

    // Built as one HTML string rather than appended nodes: this reruns on every
    // streamed fragment, and the segments are regenerated from scratch each time.
    function renderAnswerBody(answer) {
      const { segments, blocks } = splitCodeBlocks(answer || '');
      codeBlocks = blocks;

      return segments.map(seg => {
        if (seg.type === 'prose') {
          return `<span class="answer-prose">${escapeHtml(seg.text)}</span>`;
        }
        const lang = seg.block.lang || guessLanguage(seg.block.code);
        return `<div class="code-block">` +
          `<div class="code-block-head">` +
            `<span class="code-lang">${escapeHtml(lang || 'code')}</span>` +
            `<button class="copy-btn" data-index="${seg.index}">Copy</button>` +
          `</div>` +
          `<pre class="code-body">${highlight(seg.block.code, lang)}</pre>` +
        `</div>`;
      }).join('');
    }

    answerBody.addEventListener('click', (e) => {
      const btn = e.target.closest('.copy-btn');
      if (!btn) return;
      const block = codeBlocks[Number(btn.dataset.index)];
      if (!block) return;
      window.iAssist.copyToClipboard(block.code);
      btn.textContent = 'Copied';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Copy';
        btn.classList.remove('copied');
      }, 1500);
    });

    // --- Q/A model ---

    function addQuestion(text) {
      const entry = { id: nextId++, question: text, answer: null, pending: true, ts: sessionSeconds };
      entries.push(entry);
      selectedId = entry.id;
      renderList();
      renderAnswer();
      return entry;
    }

    // Answers arrive in the order their questions were sent, so the oldest
    // unanswered entry is the one this response belongs to.
    function resolveAnswer(text) {
      const entry = entries.find(e => e.pending);
      if (!entry) return;
      entry.answer = text;
      entry.pending = false;
      renderList();
      if (selectedId === entry.id) renderAnswer();
    }

    function renderList() {
      questionCount.textContent = String(entries.length);

      if (entries.length === 0) {
        transcriptPlaceholder.classList.remove('hidden');
        transcriptList.classList.add('hidden');
        return;
      }
      transcriptPlaceholder.classList.add('hidden');
      transcriptList.classList.remove('hidden');

      transcriptList.innerHTML = entries.map(e => `
        <div class="transcript-item${e.id === selectedId ? ' selected' : ''}" data-id="${e.id}">
          <div class="transcript-time">
            ${e.pending ? '<span class="pending-dot"></span>' : ''}${formatTimestamp(e.ts)}
          </div>
          <div class="transcript-text">${escapeHtml(e.question)}</div>
        </div>
      `).join('');

      transcriptScroll.scrollTop = transcriptScroll.scrollHeight;
    }

    // Streamed fragments belong to the oldest unanswered entry, same as resolveAnswer.
    function appendAnswerDelta(text) {
      const entry = entries.find(e => e.pending);
      if (!entry) return;
      entry.answer = (entry.answer || '') + text;
      if (selectedId === entry.id) renderAnswer({ preserveScroll: true });
    }

    function renderAnswer({ preserveScroll = false } = {}) {
      const entry = entries.find(e => e.id === selectedId);

      if (!entry) {
        answerQuestion.classList.add('hidden');
        answerBody.classList.add('hidden');
        thinkingIndicator.classList.add('hidden');
        answerPlaceholder.classList.remove('hidden');
        codeBlocks = [];
        return;
      }

      answerQuestion.textContent = entry.question;
      answerQuestion.classList.remove('hidden');
      answerPlaceholder.classList.add('hidden');

      // Show the spinner only until the first fragment lands; after that the
      // partial answer itself is the progress indicator.
      if (entry.pending && !entry.answer) {
        thinkingIndicator.classList.remove('hidden');
        answerBody.classList.add('hidden');
      } else {
        thinkingIndicator.classList.add('hidden');
        answerBody.innerHTML = renderAnswerBody(entry.answer);
        answerBody.classList.remove('hidden');
      }

      if (!preserveScroll) answerScroll.scrollTop = 0;
    }

    transcriptList.addEventListener('click', (e) => {
      const item = e.target.closest('.transcript-item');
      if (!item) return;
      selectedId = Number(item.dataset.id);
      renderList();
      renderAnswer();
    });

    // --- Query handling ---

    function sendQuery() {
      const message = queryInput.value.trim();
      if (!message) return;

      queryInput.value = '';
      addQuestion(message);
      conversationHistory.push({ role: 'user', text: message });
      window.iAssist.sendQuery(message, conversationHistory);
    }

    btnSend.addEventListener('click', sendQuery);
    queryInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendQuery();
      }
    });

    btnStop.addEventListener('click', () => window.iAssist.stopSession());
    btnHide.addEventListener('click', () => window.iAssist.hideSessionWindow());

    // --- IPC listeners ---

    window.iAssist.onStartAudioCapture((data) => {
      if (data.assistant) {
        assistantNameEl.textContent = data.assistant.name || 'Assistant';
        const cat = (data.assistant.category || 'general').toLowerCase();
        categoryBadge.className = `category-badge badge-${cat}`;
        categoryBadge.textContent = cat.replace('_', ' ');
      }
      applyVadConfig(data.vad);
      startTimer();
      startAudioCapture();
    });

    window.iAssist.onStopAudioCapture(() => {
      flushTranscription();
      stopAudioCapture();
      stopTimer();
    });

    window.iAssist.onTranscriptionUpdate((data) => {
      if (data.text) {
        liveText.textContent = data.text;

        pendingTranscription += (pendingTranscription ? ' ' : '') + data.text;

        if (transcriptionDebounceTimer) clearTimeout(transcriptionDebounceTimer);
        transcriptionDebounceTimer = setTimeout(flushTranscription, TRANSCRIPTION_DEBOUNCE_MS);
      }
    });

    function flushTranscription() {
      if (transcriptionDebounceTimer) {
        clearTimeout(transcriptionDebounceTimer);
        transcriptionDebounceTimer = null;
      }
      if (!pendingTranscription) return;

      const text = pendingTranscription;
      pendingTranscription = '';

      addQuestion(text);
      conversationHistory.push({ role: 'user', text });
      window.iAssist.sendQuery(text, conversationHistory);
    }

    window.iAssist.onLlmAnswerDelta((data) => {
      if (data.text) appendAnswerDelta(data.text);
    });

    window.iAssist.onLlmAnswer((data) => {
      if (data.response) {
        resolveAnswer(data.response);
        conversationHistory.push({ role: 'model', text: data.response });
      }
    });

    // The per-entry pending flag drives the spinner, so this only needs to cover
    // the case where a response lands without any question queued.
    window.iAssist.onAiThinking((data) => {
      if (!data.thinking) return;
      const entry = entries.find(e => e.id === selectedId);
      if (entry && entry.pending) thinkingIndicator.classList.remove('hidden');
    });

    window.iAssist.onOpacityUpdate((opacity) => {
      document.body.style.opacity = opacity;
    });

    window.iAssist.onThemeUpdate((theme) => {
      document.body.classList.toggle('theme-light', theme === 'light');
    });

    let currentFontSize = 13;
    window.iAssist.onAdjustFontSize((direction) => {
      currentFontSize = direction === 'inc'
        ? Math.min(24, currentFontSize + 1)
        : Math.max(10, currentFontSize - 1);
      document.documentElement.style.setProperty('--answer-font-size', currentFontSize + 'px');
    });

    // --- Init ---

    (async () => {
      const settings = await window.iAssist.getInitialSettings();
      document.body.classList.toggle('theme-light', settings.theme === 'light');
      if (settings.assistant) {
        assistantNameEl.textContent = settings.assistant.name || 'Assistant';
        const cat = (settings.assistant.category || 'general').toLowerCase();
        categoryBadge.className = `category-badge badge-${cat}`;
        categoryBadge.textContent = cat.replace('_', ' ');
      }
    })();
  </script>
</body>
</html>
